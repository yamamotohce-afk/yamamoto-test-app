<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>こころとからだ記録（試作版）</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&family=Zen+Maru+Gothic:wght@500;700&display=swap" rel="stylesheet">
<style>
/* 方針: 落ち着いた青緑を基調に、月経開始日だけをローズで示す。スマホ1カラム＋下部タブ */
:root{
  --bg:#f3f6f6; --surface:#ffffff; --ink:#1d2b2e; --muted:#5d6f73; --line:#d9e2e3;
  --accent:#2c6e72; --accent-soft:#e0eeee; --rose:#b0506a; --rose-soft:#f6e3e8;
  --warn:#9a6b10; --warn-soft:#fbf1dc; --danger:#a83a3a;
  --font-display:"Zen Maru Gothic","Hiragino Maru Gothic ProN",sans-serif;
  --font-body:"Zen Kaku Gothic New","Hiragino Sans","Noto Sans JP","Yu Gothic",sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#121a1c; --surface:#1b2629; --ink:#e3ecec; --muted:#9db0b3; --line:#2f3e41;
    --accent:#6fb5b8; --accent-soft:#213a3c; --rose:#e38aa1; --rose-soft:#3d2830;
    --warn:#e2b45a; --warn-soft:#3a3020; --danger:#e07b7b; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#121a1c; --surface:#1b2629; --ink:#e3ecec; --muted:#9db0b3; --line:#2f3e41;
  --accent:#6fb5b8; --accent-soft:#213a3c; --rose:#e38aa1; --rose-soft:#3d2830;
  --warn:#e2b45a; --warn-soft:#3a3020; --danger:#e07b7b; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:16px;line-height:1.6}
#app{max-width:520px;margin:0 auto;padding:16px 16px 96px;display:flex;flex-direction:column;gap:16px}
h1,h2,h3{font-family:var(--font-display);text-wrap:balance;margin:0;line-height:1.35}
h1{font-size:1.35rem} h2{font-size:1.1rem} h3{font-size:1rem}
p{margin:0}
.muted{color:var(--muted);font-size:.875rem}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:12px}
.stack{display:flex;flex-direction:column;gap:8px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.between{justify-content:space-between}
.btn{font:inherit;font-weight:700;border:1px solid var(--accent);background:var(--accent);color:var(--surface);border-radius:10px;padding:12px 16px;cursor:pointer;min-height:48px;text-align:center}
.btn.ghost{background:transparent;color:var(--accent)}
.btn.small{min-height:36px;padding:6px 12px;font-size:.875rem}
.btn.danger{background:transparent;color:var(--danger);border-color:var(--danger)}
.btn.block{width:100%}
.btn:focus-visible,.seg button:focus-visible,.chip:focus-visible,input:focus-visible,textarea:focus-visible,.tab:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
label.field{display:flex;flex-direction:column;gap:4px;font-weight:500}
input[type=date],input[type=text],textarea{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-height:44px;width:100%}
textarea{min-height:88px;resize:vertical}
.q{font-weight:700}
.seg{display:grid;grid-template-columns:repeat(5,1fr);gap:4px}
.seg.c3{grid-template-columns:1fr} .seg.c4{grid-template-columns:repeat(2,1fr)}
.seg button{font:inherit;font-size:.8rem;line-height:1.3;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:8px;padding:8px 2px;min-height:48px;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center}
.seg.c3 button,.seg.c4 button{font-size:.9rem;padding:10px;align-items:flex-start;text-align:left}
.seg button b{font-size:1rem;font-variant-numeric:tabular-nums}
.seg button.on{background:var(--accent);border-color:var(--accent);color:var(--surface)}
.sym{display:flex;flex-direction:column;gap:6px;padding:12px 0;border-top:1px solid var(--line)}
.sym:first-of-type{border-top:0;padding-top:0}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{font:inherit;font-size:.85rem;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:999px;padding:6px 12px;cursor:pointer;min-height:36px}
.chip.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);font-weight:700}
.chip.rose{background:var(--rose-soft);border-color:var(--rose);color:var(--rose)}
.check{display:flex;gap:10px;align-items:flex-start;padding:8px 0;cursor:pointer}
.check input{width:20px;height:20px;margin-top:3px;accent-color:var(--accent);flex:none}
.big{font-family:var(--font-display);font-size:2.2rem;font-weight:700;font-variant-numeric:tabular-nums;line-height:1}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--bg);border-radius:10px;padding:10px;text-align:center}
.stat b{display:block;font-size:1.3rem;font-variant-numeric:tabular-nums;font-family:var(--font-display)}
.stat span{font-size:.75rem;color:var(--muted)}
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.day{border-radius:8px;border:1px solid var(--line);background:var(--bg);font-size:.72rem;text-align:center;padding:4px 0;font-variant-numeric:tabular-nums;cursor:pointer;color:var(--ink);font-family:inherit}
.day.done{background:var(--accent);border-color:var(--accent);color:var(--surface)}
.day.miss{border-style:dashed;border-color:var(--warn);color:var(--warn)}
.day.future{opacity:.45;cursor:default}
.day.today{outline:2px solid var(--ink);outline-offset:1px}
.banner{border-radius:12px;padding:14px 16px;background:var(--warn-soft);border-left:4px solid var(--warn);display:flex;flex-direction:column;gap:8px}
.banner.info{background:var(--accent-soft);border-left-color:var(--accent)}
.note{font-size:.8rem;color:var(--muted);border-top:1px solid var(--line);padding-top:10px}
.rec{display:flex;flex-direction:column;gap:6px;padding:12px 0;border-top:1px solid var(--line)}
.rec:first-child{border-top:0;padding-top:0}
.pill{display:inline-block;font-size:.75rem;border-radius:999px;padding:2px 8px;background:var(--accent-soft);color:var(--accent);font-weight:700}
.pill.rose{background:var(--rose-soft);color:var(--rose)}
.pill.lv3,.pill.lv4{background:var(--accent);color:var(--surface)}
.bar{display:grid;grid-template-columns:7.5em 1fr 3em;gap:8px;align-items:center;font-size:.85rem}
.bar .track{height:12px;background:var(--bg);border-radius:6px;overflow:hidden}
.bar .fill{height:100%;background:var(--accent);border-radius:6px}
.bar .num{text-align:right;font-variant-numeric:tabular-nums}
table{border-collapse:collapse;width:100%;font-size:.8rem;font-variant-numeric:tabular-nums}
th,td{border-bottom:1px solid var(--line);padding:6px 4px;text-align:center;white-space:nowrap}
th{color:var(--muted);font-weight:500}
td.l,th.l{text-align:left;white-space:normal}
.scroll{overflow-x:auto}
svg text{fill:var(--muted);font-family:var(--font-body)}
.strip{display:flex;gap:2px;overflow-x:auto;padding-bottom:4px}
.strip div{flex:0 0 22px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.62rem;color:var(--muted);font-variant-numeric:tabular-nums}
.strip i{display:block;width:22px;height:28px;border-radius:5px;background:var(--bg);border:1px solid var(--line)}
.strip .p{color:var(--rose);font-weight:700}
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);display:flex;justify-content:center;z-index:5}
nav.tabs .inner{max-width:520px;width:100%;display:grid;grid-template-columns:repeat(5,1fr)}
.tab{font:inherit;font-size:.75rem;background:none;border:0;color:var(--muted);padding:8px 0 12px;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;min-height:56px}
.tab svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8}
.tab.on{color:var(--accent);font-weight:700}
.overlay{position:fixed;inset:0;background:rgba(10,20,22,.45);display:flex;align-items:flex-end;justify-content:center;z-index:10;padding:16px}
.dialog{background:var(--surface);color:var(--ink);border-radius:16px;padding:20px;max-width:488px;width:100%;display:flex;flex-direction:column;gap:12px;max-height:85vh;overflow:auto}
.toast{position:fixed;left:50%;bottom:80px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:.875rem;z-index:20}
.err{color:var(--danger);font-size:.875rem;font-weight:700}
.cmp td{white-space:normal}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<main id="app" aria-live="polite"></main>
<nav class="tabs" id="tabs" hidden><div class="inner">
  <button class="tab" id="tab-home" data-act="go" data-view="home"><svg viewBox="0 0 24 24"><path d="M4 11l8-7 8 7v9H4z"/></svg>ホーム</button>
  <button class="tab" id="tab-record" data-act="go" data-view="record"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>記録</button>
  <button class="tab" id="tab-list" data-act="go" data-view="list"><svg viewBox="0 0 24 24"><path d="M5 6h14M5 12h14M5 18h14"/></svg>一覧</button>
  <button class="tab" id="tab-review" data-act="go" data-view="review"><svg viewBox="0 0 24 24"><path d="M4 19V5M4 19h16M8 15l4-5 3 3 4-6"/></svg>振り返り</button>
  <button class="tab" id="tab-share" data-act="go" data-view="share"><svg viewBox="0 0 24 24"><path d="M7 3h7l4 4v14H7zM14 3v4h4M10 12h5M10 16h5"/></svg>共有・データ</button>
</div></nav>
<div id="layer"></div>
<script>
(function(){
"use strict";
var KEY="pmdd-proto-v1";
var SYMS=[["mood","気分の落ち込み"],["irrit","イライラ・不安"],["fatigue","疲労感"],["sleepy","眠気"],["focus","集中力の低下"],["pain","頭痛・身体の痛み"],["other","その他"]];
var IMPS=[["work","仕事・学業"],["house","家事"],["relation","人間関係"],["life","その他の生活（外出・趣味など）"]];
var LV=["なし","軽い","中くらい","強い","とても強い"];
var ILV=["なし","少し","ある程度","かなり","とても大きい"];
var UNDER=["まったく","あまり","どちらとも","ある程度","よく"];
var INTENT={want:"医療機関に相談したい",unsure:"相談するか迷っている",no:"今は相談するつもりはない"};
var REASONS=["受診するほどではないと思う","どの診療科に行けばよいかわからない","受診する時間がとれない","費用が気になる","症状をうまく説明できる自信がない","婦人科や心療内科の受診に抵抗がある","周囲に知られたくない","その他"];
var CHANGE=["深まった","やや深まった","変わらない","わからない"];
var EASE=["使いにくい","やや使いにくい","ふつう","やや使いやすい","使いやすい"];
var BURDEN=["負担はない","あまりない","どちらとも","やや負担","とても負担"];

/* ---------- 日付 ---------- */
function pad(n){return String(n).padStart(2,"0")}
function fmt(d){return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())}
function parse(s){var a=s.split("-").map(Number);return new Date(a[0],a[1]-1,a[2])}
function addDays(s,n){var d=parse(s);d.setDate(d.getDate()+n);return fmt(d)}
function diff(a,b){return Math.round((parse(a)-parse(b))/86400000)}
function today(){return fmt(new Date())}
function jp(s){var d=parse(s);return (d.getMonth()+1)+"/"+d.getDate()+"（"+"日月火水木金土"[d.getDay()]+"）"}
function jpLong(s){var d=parse(s);return d.getFullYear()+"年"+(d.getMonth()+1)+"月"+d.getDate()+"日"}
function md(s){var d=parse(s);return (d.getMonth()+1)+"/"+d.getDate()}
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}

/* ---------- 保存 ---------- */
var storageOK=true;
function blank(){return {version:1,profile:null,periods:[],pre:null,post:null,records:{},endNoticeSeen:false}}
function load(){try{var s=localStorage.getItem(KEY);return s?JSON.parse(s):blank()}catch(e){storageOK=false;return blank()}}
var S=load();
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){storageOK=false}}

/* ---------- 画面状態 ---------- */
var view=S.profile?"home":"welcome";
var ui={ob:{reasons:[]},post:{reasons:[]},draft:null,err:"",trend:"mood"};
var dlPromise=(window.claude&&typeof window.claude.use==="function")?window.claude.use("downloads").catch(function(){return null}):Promise.resolve(null);

/* ---------- 計算 ---------- */
function elapsed(){return S.profile?diff(today(),S.profile.startDate)+1:0}
function windowDays(){var out=[];if(!S.profile)return out;for(var i=0;i<14;i++)out.push(addDays(S.profile.startDate,i));return out}
function recDates(){return Object.keys(S.records).sort()}
function periods(){return S.periods.slice().sort()}
function prevPeriod(d){var p=periods().filter(function(x){return x<=d});return p.length?p[p.length-1]:null}
function nextPeriod(d){var p=periods().filter(function(x){return x>d});return p.length?p[0]:null}
function relText(d){
  var t=[],p=prevPeriod(d),n=nextPeriod(d);
  if(p)t.push("月経開始から"+(diff(d,p)+1)+"日目");
  if(n)t.push("次の月経開始の"+diff(n,d)+"日前");
  return t.join("・")||"月経開始日の登録なし";
}
function total(r){return SYMS.reduce(function(a,s){return a+(r.sym[s[0]]||0)},0)}
function stats(){
  var w=windowDays(),t=today(),past=w.filter(function(d){return d<=t});
  var done=w.filter(function(d){return S.records[d]});
  var miss=past.filter(function(d){return !S.records[d]});
  return {done:done.length,miss:miss,left:Math.max(0,14-past.length),past:past.length};
}
function ended(){return elapsed()>=14}

/* ---------- 部品 ---------- */
function seg(form,path,val,labels,opt){
  opt=opt||{};var cls=opt.cls||"";var start=opt.start==null?0:opt.start;
  return '<div class="seg '+cls+'" role="radiogroup">'+labels.map(function(l,i){
    var v=opt.keys?opt.keys[i]:i+start;var on=String(val)===String(v);
    return '<button type="button" role="radio" aria-checked="'+on+'" class="'+(on?"on":"")+'" data-act="pick" data-form="'+form+'" data-path="'+path+'" data-val="'+v+'">'+(opt.keys||opt.nonum?"":"<b>"+v+"</b>")+esc(l)+'</button>';
  }).join("")+'</div>';
}
function reasonsBox(form,obj){
  return '<div class="stack"><p class="q">受診・相談をためらう理由（当てはまるものすべて）</p>'+REASONS.map(function(r,i){
    var id=form+"-rs-"+i;var on=obj.reasons.indexOf(r)>=0;
    return '<label class="check" for="'+id+'"><input type="checkbox" id="'+id+'" data-act="toggle" data-form="'+form+'" data-val="'+esc(r)+'" '+(on?"checked":"")+'><span>'+esc(r)+'</span></label>';
  }).join("")+(obj.reasons.indexOf("その他")>=0?'<input type="text" id="'+form+'-rs-other" aria-label="その他の理由" placeholder="その他の理由" data-form="'+form+'" data-path="reasonOther" value="'+esc(obj.reasonOther||"")+'">':'')+'</div>';
}
function disclaimer(){return '<p class="note">このアプリは記録と振り返りのための試作品です。診断や、受診が必要かどうかの判定は行いません。つらい症状が続くときや不安なときは、医療機関に相談してください。</p>'}

/* ---------- 画面: はじめに ---------- */
function vWelcome(){
  return '<div class="card"><h1>こころとからだ記録</h1><p>月経に伴う心と体の不調を14日間記録して、自分の状態を振り返るための試作アプリです。</p>'+
  '<ul class="muted" style="margin:0;padding-left:1.2em"><li>1日1回、気になる症状と生活への影響を記録します</li><li>記録はこの端末のブラウザ内だけに保存され、外部には送信されません</li><li>受診の必要性を判定する機能はありません</li></ul>'+
  '<button class="btn block" data-act="go" data-view="onboard">はじめる</button>'+
  '<button class="btn ghost block" data-act="sample">サンプルデータで試す</button></div>'+
  (storageOK?'':'<div class="banner"><b>このブラウザでは保存ができません</b><p class="muted">プライベートモードなどでは、画面を閉じると記録が消えます。</p></div>');
}

/* ---------- 画面: 初回評価 ---------- */
function vOnboard(){
  var o=ui.ob;
  return '<h1>利用開始の登録</h1>'+
  '<div class="card"><label class="field" for="ob-start">使用開始日<input type="date" id="ob-start" data-form="ob" data-path="startDate" value="'+esc(o.startDate||today())+'"></label>'+
  '<label class="field" for="ob-period">直近の月経開始日<input type="date" id="ob-period" data-form="ob" data-path="period" max="'+today()+'" value="'+esc(o.period||"")+'"></label>'+
  '<p class="muted">はっきりしない場合はおおよその日で構いません。あとから追加・変更できます。</p></div>'+
  '<div class="card"><h2>使用前のアンケート</h2>'+
  '<p class="q">月経に伴う自分の心身の不調について、どの程度わかっていると感じますか</p>'+seg("ob","understanding",o.understanding,UNDER,{start:1})+
  '<p class="q">現在、この不調について医療機関に相談したいと思いますか</p>'+seg("ob","intent",o.intent,[INTENT.want,INTENT.unsure,INTENT.no],{cls:"c3",keys:["want","unsure","no"]})+
  reasonsBox("ob",o)+'</div>'+
  (ui.err?'<p class="err" role="alert">'+esc(ui.err)+'</p>':'')+
  '<button class="btn block" data-act="startUse">登録して記録をはじめる</button>'+
  '<button class="btn ghost block" data-act="go" data-view="welcome">戻る</button>';
}

/* ---------- 画面: ホーム ---------- */
function vHome(){
  var st=stats(),e=elapsed(),t=today(),w=windowDays();
  var dayLabel=e<1?"開始前":e>14?"14日間終了":e+"日目";
  var cells=w.map(function(d,i){
    var c=d>t?"future":S.records[d]?"done":"miss";if(d===t)c+=" today";
    var p=S.periods.indexOf(d)>=0;
    return '<button class="day '+c+'" '+(d>t?'disabled':'data-act="edit" data-date="'+d+'"')+' aria-label="'+jp(d)+(S.records[d]?" 記録あり":d>t?"":" 未記録")+'">'+(i+1)+'<br>'+md(d)+(p?'<br><span style="color:var(--rose)">●</span>':'')+'</button>';
  }).join("");
  var endBanner="";
  if(ended()&&!S.post)endBanner='<div class="banner"><b>14日間の記録期間が終わりました</b><p>おつかれさまでした。使用後のアンケートに回答してください（約3分）。</p><button class="btn" data-act="go" data-view="post">使用後アンケートに回答する</button></div>';
  else if(S.post)endBanner='<div class="banner info"><b>使用後アンケートに回答済みです</b><p class="muted">振り返りタブで使用前後の回答を比較できます。</p></div>';
  return '<div class="card"><div class="row between"><div><p class="muted">'+jpLong(t)+'</p><p class="big">'+dayLabel+'</p></div><p class="muted" style="text-align:right">14日間の記録<br>'+jp(S.profile.startDate)+'〜'+jp(addDays(S.profile.startDate,13))+'</p></div>'+
  '<div class="stats"><div class="stat"><b>'+st.done+'</b><span>記録した日</span></div><div class="stat"><b>'+st.miss.length+'</b><span>未記録の日</span></div><div class="stat"><b>'+st.left+'</b><span>残り日数</span></div></div>'+
  '<div class="days">'+cells+'</div><p class="muted">塗りつぶし＝記録あり、点線＝未記録。日付を押すとその日の記録を入力・修正できます。<span style="color:var(--rose)">●</span>は月経開始日です。</p></div>'+
  endBanner+
  (e>=1&&e<=14||S.records[t]?'<div class="card"><h2>今日の記録</h2>'+(S.records[t]?'<p>記録済みです。必要に応じて修正できます。</p><button class="btn ghost block" data-act="edit" data-date="'+t+'">今日の記録を修正する</button>':'<p>まだ記録していません。</p><button class="btn block" data-act="edit" data-date="'+t+'">今日の記録をつける</button>')+'</div>':'')+
  (st.miss.length?'<div class="card"><h2>未記録の日</h2><div class="chips">'+st.miss.map(function(d){return '<button class="chip" data-act="edit" data-date="'+d+'">'+jp(d)+'</button>'}).join("")+'</div><p class="muted">思い出せる範囲で記録できます。</p></div>':'')+

/* ---------- 画面: 振り返り ---------- */
function rangeDays(){
  var ds=recDates();if(!S.profile)return [];
  var a=S.profile.startDate,b=addDays(a,13);
  if(ds.length){if(ds[0]<a)a=ds[0];if(ds[ds.length-1]>b)b=ds[ds.length-1]}
  periods().forEach(function(p){if(diff(a,p)>0&&diff(a,p)<=10)a=p});
  var out=[];for(var d=a;d<=b;d=addDays(d,1))out.push(d);return out;
}
function trendSvg(key){
  var days=rangeDays(),W=340,H=170,L=26,R=8,T=12,B=30,max=key==="total"?28:4;
  var x=function(i){return L+(days.length<2?0:i*(W-L-R)/(days.length-1))};
  var y=function(v){return T+(H-T-B)*(1-v/max)};
  var g="",ticks=key==="total"?[0,7,14,21,28]:[0,1,2,3,4];
  ticks.forEach(function(v){g+='<line x1="'+L+'" x2="'+(W-R)+'" y1="'+y(v)+'" y2="'+y(v)+'" stroke="var(--line)" stroke-width="1"/><text x="'+(L-6)+'" y="'+(y(v)+4)+'" font-size="10" text-anchor="end">'+v+'</text>'});
  days.forEach(function(d,i){if(S.periods.indexOf(d)>=0)g+='<line x1="'+x(i)+'" x2="'+x(i)+'" y1="'+T+'" y2="'+(H-B)+'" stroke="var(--rose)" stroke-dasharray="3 3" stroke-width="1.5"/><text x="'+x(i)+'" y="'+(T+2)+'" font-size="9" text-anchor="middle" style="fill:var(--rose)">月経開始</text>'});
  var step=Math.ceil(days.length/7);
  days.forEach(function(d,i){if(i%step===0||i===days.length-1)g+='<text x="'+x(i)+'" y="'+(H-B+16)+'" font-size="10" text-anchor="middle">'+md(d)+'</text>'});
  var segs=[],cur=[];
  days.forEach(function(d,i){var r=S.records[d];if(r){cur.push([x(i),y(key==="total"?total(r):r.sym[key]||0)])}else if(cur.length){segs.push(cur);cur=[]}});
  if(cur.length)segs.push(cur);
  segs.forEach(function(s){
    if(s.length>1){g+='<path d="M'+s.map(function(p){return p.join(",")}).join("L")+' L'+s[s.length-1][0]+','+y(0)+' L'+s[0][0]+','+y(0)+'Z" fill="var(--accent)" opacity=".12"/>';g+='<polyline points="'+s.map(function(p){return p.join(",")}).join(" ")+'" fill="none" stroke="var(--accent)" stroke-width="2.2" stroke-linejoin="round"/>'}
    s.forEach(function(p){g+='<circle cx="'+p[0]+'" cy="'+p[1]+'" r="3" fill="var(--accent)"/>'});
  });
  return '<svg viewBox="0 0 '+W+' '+H+'" width="100%" role="img" aria-label="症状の程度の推移">'+g+'</svg>';
}
function compareTable(){
  var a=S.pre||{},b=S.post;

  return '<div class="scroll"><table class="cmp"><tr><th class="l">項目</th><th class="l">使用前</th><th class="l">使用後</th></tr>'+

  var ds=recDates();
  return '<h1>共有・データ</h1>'+
  '<div class="card"><h2>医師への情報共有</h2><p class="muted">症状、程度、月経開始日、生活への影響を一覧にしたものです。受診時に画面を見せるか、ファイルで保存して印刷できます。</p>'+
  (ds.length?'<div class="row"><button class="btn small" data-act="dlSummary">一覧を保存（HTML）</button><button class="btn small ghost" data-act="copySummary">テキストをコピー</button><button class="btn small ghost" data-act="showSummary">画面で見せる</button></div>':'<p>記録がまだありません。</p>')+'</div>'+
  '<div class="card"><h2>データの書き出し・読み込み</h2><div class="row"><button class="btn small" data-act="dlJSON">全データ（JSON）</button><button class="btn small ghost" data-act="dlCSV">記録の表（CSV）</button></div>'+
  '<label class="field" for="import-file">JSONから読み込む（現在のデータは置き換わります）<input type="file" id="import-file" accept="application/json,.json"></label></div>'+
  '<div class="card"><h2>検証用</h2><button class="btn ghost" data-act="sample">サンプルデータを読み込む</button><p class="muted">14日間の記録・月経開始日・使用前後アンケートが入った例に置き換わります。</p></div>'+
  '<div class="card"><h2>データの削除</h2><p class="muted">このブラウザに保存されたすべての記録とアンケート回答を削除します。元に戻せません。</p><button class="btn danger" data-act="askWipe">すべてのデータを削除する</button></div>'+
  '<div class="card"><h2>保存について</h2><p class="muted">記録はこの端末のブラウザ内（localStorage）にのみ保存され、外部のサーバーには送信されません。別の端末やブラウザとは共有されないため、機種変更などの際はJSONで書き出して読み込んでください。</p>'+(storageOK?'':'<p class="err">このブラウザでは保存できない状態です。</p>')+'</div>'+disclaimer();
}

/* ---------- サンプル ---------- */
function sample(){
  var t=today(),start=addDays(t,-13),p1=addDays(t,-30),p2=addDays(t,-2);
  var rec={},notes={};
  notes[addDays(t,-8)]="仕事でささいなことにイライラして、あとで落ち込んだ";
  notes[addDays(t,-6)]="朝起きられず、午前中は集中できなかった";
  notes[addDays(t,-4)]="家族に強く言ってしまった。夕方から頭痛";
  notes[addDays(t,-1)]="少し楽になってきた";
  var seed=7;function rnd(){seed=(seed*9301+49297)%233280;return seed/233280}
  for(var i=0;i<14;i++){
    var d=addDays(start,i);if(i===3||i===8)continue;
    var rel=diff(d,p2),base=rel<0?Math.max(0,Math.min(4,Math.round(4-(-rel-1)/2.2))):Math.max(0,2-rel);
    if(rel<-9)base=0;
    var s={};SYMS.forEach(function(x,j){var off=[0,0,-1,-1,0,-1,-2][j];var v=base+off+(rnd()<.3?1:0)-(rnd()<.2?1:0);s[x[0]]=Math.max(0,Math.min(4,v))});
    var tot=total({sym:s});
    var imp={work:Math.min(4,Math.round(tot/6)),house:Math.min(4,Math.round(tot/8)),relation:Math.min(4,Math.round((s.irrit+s.mood)/2.5)),life:Math.min(4,Math.round(tot/9))};
    rec[d]={date:d,sym:s,otherLabel:s.other>0?"むくみ":"",impact:imp,note:notes[d]||""};
  }
  S={version:1,profile:{startDate:start,createdAt:new Date().toISOString(),sample:true},periods:[p1,p2],records:rec,
    pre:{understanding:2,intent:"unsure",reasons:["どの診療科に行けばよいかわからない","症状をうまく説明できる自信がない"],reasonOther:""},
    post:{change:"深まった",understanding:4,intent:"want",reasons:["受診する時間がとれない"],reasonOther:"",ease:4,burden:2,free:"記録をつけると、月経前の数日に気分の落ち込みが重なっていることに気づいた。"},endNoticeSeen:true};
  save();
}

/* ---------- ダイアログ・通知 ---------- */
var layer=document.getElementById("layer");
function dialog(html){layer.innerHTML='<div class="overlay" data-act="closeBg"><div class="dialog" role="dialog" aria-modal="true">'+html+'</div></div>';var f=layer.querySelector("button");if(f)f.focus()}
function closeDialog(){layer.innerHTML=""}
var toastTimer;
function toast(m){var el=document.createElement("div");el.className="toast";el.setAttribute("role","status");el.textContent=m;document.body.appendChild(el);clearTimeout(toastTimer);toastTimer=setTimeout(function(){el.remove()},2400)}
var pendingCopy="";
function fallbackText(title,text){pendingCopy=text;dialog('<h2>'+esc(title)+'</h2><p class="muted">この画面ではファイル保存ができないため、内容をコピーしてご利用ください。</p><textarea readonly style="min-height:200px" aria-label="書き出す内容">'+esc(text)+'</textarea><div class="row"><button class="btn" data-act="copyPending">コピー</button><button class="btn ghost" data-act="close">閉じる</button></div>')}
function saveFile(name,data){
  dlPromise.then(function(dl){
    if(!dl){fallbackText(name,data);return}
    dl.save({filename:name,data:data}).then(function(){toast("保存しました")}).catch(function(e){
      if(e&&e.code==="declined")toast("保存を取りやめました");
      else if(e&&e.code==="rate_limited")toast("少し待ってからもう一度お試しください");
      else fallbackText(name,data);
    });
  });
}
function copy(text){
  if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(text).then(function(){toast("コピーしました")},function(){fallbackText("コピー",text)})}
  else fallbackText("コピー",text);
}
function stamp(){return today().replace(/-/g,"")}

/* ---------- 描画 ---------- */
function render(){
  var app=document.getElementById("app"),tabs=document.getElementById("tabs");
  var fn={welcome:vWelcome,onboard:vOnboard,home:vHome,record:vRecord,list:vList,review:vReview,share:vShare,post:vPost}[view]||vHome;
  if(!S.profile&&["welcome","onboard"].indexOf(view)<0)view="welcome",fn=vWelcome;
  app.innerHTML=fn();
  tabs.hidden=!S.profile;
  ["home","record","list","review","share"].forEach(function(v){var b=document.getElementById("tab-"+v);var on=v===view||(v==="home"&&view==="post");b.classList.toggle("on",on);if(on)b.setAttribute("aria-current","page");else b.removeAttribute("aria-current")});
  if(S.profile&&view==="home"&&ended()&&!S.post&&!S.endNoticeSeen){
    S.endNoticeSeen=true;save();
    dialog('<h2>14日間の記録期間が終わりました</h2><p>毎日の記録、おつかれさまでした。最後に使用後のアンケート（約3分）に回答してください。</p><button class="btn" data-act="goPost">アンケートに回答する</button><button class="btn ghost" data-act="close">あとで回答する</button>');
  }
}
function go(v){view=v;ui.err="";if(v==="post")ui.post.loaded=false;if(v==="record"&&!ui.draft)openDraft(today());render();window.scrollTo(0,0)}

function setPath(obj,path,val){var p=path.split(".");var o=obj;for(var i=0;i<p.length-1;i++)o=o[p[i]];o[p[p.length-1]]=val}
function formObj(f){return f==="draft"?ui.draft:ui[f]}

var A={
  go:function(t){go(t.dataset.view)},
  goPost:function(){closeDialog();go("post")},
  close:closeDialog,
  closeBg:function(t,e){if(e.target===t)closeDialog()},
  pick:function(t){var v=t.dataset.val;setPath(formObj(t.dataset.form),t.dataset.path,/^\d+$/.test(v)?Number(v):v);var y=window.scrollY;render();window.scrollTo(0,y)},
  toggle:function(t){var o=formObj(t.dataset.form),v=t.dataset.val,i=o.reasons.indexOf(v);if(i>=0)o.reasons.splice(i,1);else o.reasons.push(v);var y=window.scrollY;render();window.scrollTo(0,y)},
  startUse:function(){
    var o=ui.ob;o.startDate=o.startDate||today();
    if(!o.period){ui.err="直近の月経開始日を入力してください。";return render()}
    if(!o.understanding||!o.intent){ui.err="使用前のアンケートの2つの質問に回答してください。";return render()}
    S=blank();S.profile={startDate:o.startDate,createdAt:new Date().toISOString()};S.periods=[o.period];
    S.pre={understanding:o.understanding,intent:o.intent,reasons:o.reasons.slice(),reasonOther:o.reasonOther||"",answeredAt:new Date().toISOString()};
    save();ui.err="";toast("登録しました");go("home");
  },
  edit:function(t){openDraft(t.dataset.date);go("record")},
  periodFlag:function(t){ui.draft.periodStart=t.checked},
  saveRec:function(){
    var r=ui.draft,d=r.date;if(!d)return toast("記録日を選んでください");
    var keep={date:d,sym:r.sym,otherLabel:r.otherLabel||"",impact:r.impact,note:r.note||"",updatedAt:new Date().toISOString()};
    S.records[d]=keep;
    var i=S.periods.indexOf(d);if(r.periodStart&&i<0)S.periods.push(d);if(!r.periodStart&&i>=0)S.periods.splice(i,1);
    save();ui.draft=null;toast(jp(d)+"の記録を保存しました");go("home");
  },
  askDel:function(t){var d=t.dataset.date;dialog('<h2>'+jp(d)+'の記録を削除しますか</h2><p>削除した記録は元に戻せません。</p><button class="btn danger" data-act="doDel" data-date="'+d+'">削除する</button><button class="btn ghost" data-act="close">やめる</button>')},
  doDel:function(t){delete S.records[t.dataset.date];save();closeDialog();if(ui.draft&&ui.draft.date===t.dataset.date)ui.draft=null;toast("削除しました");if(view==="record")go("list");else render()},
  addPeriod:function(){var v=document.getElementById("add-period").value;if(!v)return toast("日付を選んでください");if(S.periods.indexOf(v)<0)S.periods.push(v);save();toast("月経開始日を追加しました");render()},
  delPeriod:function(t){var i=S.periods.indexOf(t.dataset.date);if(i>=0)S.periods.splice(i,1);save();render()},
  trend:function(t){ui.trend=t.dataset.key;var y=window.scrollY;render();window.scrollTo(0,y)},
  savePost:function(){var o=ui.post;if(!o.change||!o.understanding||!o.intent||!o.ease||!o.burden){ui.err="自由記載以外の質問すべてに回答してください。";return render()}
    S.post={change:o.change,understanding:o.understanding,intent:o.intent,reasons:o.reasons.slice(),reasonOther:o.reasonOther||"",ease:o.ease,burden:o.burden,free:o.free||"",answeredAt:new Date().toISOString()};
    save();toast("回答を保存しました");go("review")},
  dlSummary:function(){saveFile("受診時メモ_"+stamp()+".html",summaryHTML(true))},
  copySummary:function(){copy(summaryText())},
  showSummary:function(){dialog('<div class="row between"><span class="pill">本人の記録</span><button class="btn small ghost" data-act="close">閉じる</button></div>'+summaryHTML(false))},
  dlJSON:function(){saveFile("こころとからだ記録_"+stamp()+".json",JSON.stringify(S,null,2))},
  dlCSV:function(){if(!recDates().length)return toast("記録がまだありません");saveFile("症状記録_"+stamp()+".csv",csv())},
  copyPending:function(){copy(pendingCopy)},
  sample:function(){if(S.profile&&!S.profile.sample&&recDates().length){dialog('<h2>サンプルデータに置き換えますか</h2><p>現在の記録はすべて置き換わります。必要なら先にJSONで書き出してください。</p><button class="btn danger" data-act="doSample">置き換える</button><button class="btn ghost" data-act="close">やめる</button>');return}A.doSample()},
  doSample:function(){closeDialog();sample();ui.draft=null;toast("サンプルデータを読み込みました");go("home")},
  askWipe:function(){dialog('<h2>すべてのデータを削除しますか</h2><p>記録、月経開始日、アンケート回答がこのブラウザから削除されます。元に戻せません。</p><button class="btn danger" data-act="doWipe">すべて削除する</button><button class="btn ghost" data-act="close">やめる</button>')},
  doWipe:function(){try{localStorage.removeItem(KEY)}catch(e){}S=blank();ui={ob:{reasons:[]},post:{reasons:[]},draft:null,err:"",trend:"mood"};closeDialog();toast("削除しました");go("welcome")}
};
document.addEventListener("click",function(e){var t=e.target.closest("[data-act]");if(!t)return;var a=t.dataset.act;if(a==="periodFlag"||a==="changeDate")return;if(t.tagName==="INPUT"&&a!=="toggle")return;if(A[a])A[a](t,e)});
document.addEventListener("input",function(e){var t=e.target;if(t.dataset.form&&t.dataset.path&&t.type!=="checkbox"){var o=formObj(t.dataset.form);if(o)setPath(o,t.dataset.path,t.value)}});
document.addEventListener("change",function(e){
  var t=e.target;
  if(t.dataset.act==="periodFlag")A.periodFlag(t);
  if(t.dataset.act==="changeDate"&&t.value){openDraft(t.value);render()}
  if(t.id==="import-file"&&t.files&&t.files[0]){
    var fr=new FileReader();fr.onload=function(){try{var d=JSON.parse(fr.result);if(!d||!d.records||!d.profile)throw 0;S=d;S.periods=S.periods||[];save();toast("読み込みました");go("home")}catch(err){toast("このアプリで書き出したJSONを選んでください")}};fr.readAsText(t.files[0]);
  }
});
document.addEventListener("keydown",function(e){if(e.key==="Escape"&&layer.innerHTML)closeDialog()});
render();
})();
</script>
</body>
